[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dhaka-heatwave-methods"
version = "0.1.0"
description = "Reproducible methods-first analysis of Dhaka heatwaves"
requires-python = ">=3.11"
dependencies = [
  "numpy==2.5.2",
  "pandas==2.3.3",
  "scipy==1.16.1",
  "statsmodels==0.14.5",
  "scikit-learn==1.7.2",
  "matplotlib==3.11.1",
  "seaborn==0.13.2",
  "PyYAML==6.0.3",
  "openpyxl==3.1.5",
  "nbformat==5.10.4",
  "nbclient==0.10.2",
  "tabulate==0.9.0",
  "pyshp==2.3.1",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
